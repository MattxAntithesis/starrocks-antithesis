# Antithesis "loads" workload, shared-data variant: 1 FE in shared_data run
# mode, 3 compute nodes (the BE image started as CN), an S3-compatible object
# store (SeaweedFS), and the driver. Tables live in object storage.
# Build from antithesis/loads/config-shared with `docker compose build`.
x-cn: &cn
  platform: linux/amd64
  image: ${BE_IMAGE:-starrocks-be-antithesis:latest}
  depends_on: [fe]
  environment:
    BE_MODE: cn

services:
  s3:
    container_name: s3
    hostname: s3
    platform: linux/amd64
    image: starrocks-s3-antithesis:latest
    build:
      context: ..
      dockerfile: s3/Dockerfile

  fe:
    container_name: fe
    hostname: fe
    platform: linux/amd64
    image: starrocks-fe-antithesis:latest
    depends_on: [s3]
    environment:
      FE_RUN_MODE: shared_data
      # Make shared-data background work frequent enough to collide with loads
      # and faults: autovacuum every 10 s per partition, full vacuum (orphan
      # file cleanup, off by default) every minute, compaction at a low score.
      # The vacuum grace period stays at 2 minutes, longer than any query the
      # driver runs (10-15 s timeouts), as StarRocks requires; a missing file
      # is then StarRocks' bug, not this configuration's.
      FE_EXTRA_CONF: |
        lake_autovacuum_partition_naptime_seconds = 10
        lake_autovacuum_grace_period_minutes = 2
        lake_enable_fullvacuum = true
        lake_fullvacuum_partition_naptime_seconds = 60
        lake_compaction_score_selector_min_score = 2
        lake_compaction_interval_ms_on_success = 1000
    build:
      context: ..
      dockerfile: fe/Dockerfile
      args:
        STARROCKS_VERSION: ${STARROCKS_VERSION:-4.1.7}

  cn1:
    <<: *cn
    container_name: cn1
    hostname: cn1
    build:
      context: ..
      dockerfile: ${BE_DOCKERFILE:-be/Dockerfile}
      args:
        STARROCKS_VERSION: ${STARROCKS_VERSION:-4.1.7}
  cn2:
    <<: *cn
    container_name: cn2
    hostname: cn2
  cn3:
    <<: *cn
    container_name: cn3
    hostname: cn3

  driver:
    container_name: driver
    hostname: driver
    platform: linux/amd64
    image: starrocks-loads-driver:latest
    build:
      context: ..
      dockerfile: driver/Dockerfile
    environment:
      DRIVER_MULTI_TABLE_TXN: "on"
      DRIVER_SHARED_DATA: "on"
      FE_HOST: fe
      BE_HOSTS: cn1,cn2,cn3
      RUST_BACKTRACE: "1"
